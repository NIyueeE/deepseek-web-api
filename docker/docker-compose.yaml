# Docker compose entry point — run from project root:
#   cp config.example.toml config/config.toml   # 首次部署必须：见 README 的容器说明
#   docker compose -f docker/docker-compose.yaml up -d
#
# 注意：≤ v0.5.1 的已发布镜像在 config.toml 缺失时会生成 host = "127.0.0.1" 的配置，
# 导致宿主机访问不到 22217；源码构建的镜像（含 entrypoint.sh）已自动处理。

services:
  ds-free-api:
    image: ghcr.io/niyueee/ds-free-api:latest
    container_name: ds-free-api
    restart: unless-stopped
    ports:
      - "22217:22217"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - RUST_LOG=info
      - DS_DATA_DIR=/app/data
      - DS_CONFIG_PATH=/app/config/config.toml
      - TZ=Asia/Shanghai
