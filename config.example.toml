[server]
host = "127.0.0.1"
port = 22217

# CORS 允许的 Origin 列表（默认 ["http://localhost:22217"]）
# cors_origins = ["http://localhost:22217"]

# API Key 和管理密码通过 Web 管理面板配置（http://127.0.0.1:22217/admin）
# [[api_keys]]
# key = "sk-test"
# description = "开发测试"

[ds_core]
# 账号池（[[ds_core.accounts]]）
# 邮箱登录示例
# [[ds_core.accounts]]
# email = "user1@example.com"
# mobile = ""
# area_code = ""
# password = "pass1"

# 中国手机号登录示例
# [[ds_core.accounts]]
# email = ""
# mobile = "13800138000"
# area_code = "+86"
# password = "pass2"

# 设备指纹 ID（**必填**）：缺失会被登录风控直接拒绝
# （客户端错误: Business error: code=11, msg=RISK_DEVICE_DETECTED）
#
# 获取方式：用 Chrome 打开 https://chat.deepseek.com/sign_in 并登录一次，
# 在开发者工具 → Network 中查看 POST /api/v0/users/login 请求体里的 device_id 值；
# 也可在页面加载完成后于控制台执行 SMSdk.getDeviceId() 直接读取。
#
# ⚠️ **不能伪造**：实测伪造的 device_id（无论 base64 还是普通字符串）都会返回
#    RISK_DEVICE_DETECTED(biz_code=11)，必须是真实注册过的指纹。
# ⚠️ 强烈建议**每个账号使用独立的 device_id**（例如各自用一个浏览器配置文件 / 无痕窗口登录一次）
#    —— 注意这需要为每个账号单独注册一次设备，不能靠生成随机值代替。
#    该 ID 是设备级的，上游用它做关联与画像。实测：同一个 device_id 下挂多个账号、
#    累计数百次请求后，这些账号会被禁言（biz_code=5）。服务启动时若检测到多个账号
#    共用同一指纹，会在日志中给出警告。
# 留空则沿用服务端已有值（管理面板保存时不会覆盖）。
# 示例（按账号分别填写）：
# [[ds_core.accounts]]
# email = "user2@example.com"
# mobile = ""
# area_code = ""
# password = "pass3"
# device_id = "Bjyk87PcoVWPPBrs3aHGgXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX=="

# 已验证通过的 User-Agent（Android 客户端模拟）
# user_agent = "DeepSeek/2.5.0 Android/35"
#
# 客户端拟态身份：UA / X-Client-Version / X-Client-Platform / 登录 payload 的 os
# 应保持一致（web ↔ 安卓）。注意 UA 用桌面 Chrome 会被 AWS WAF 以 202 challenge
# 拦截（Rust 客户端无法执行 JS challenge），因此默认保持安卓 App 身份。
# X-Client-Version（应用版本号）
# client_version = "2.5.0"
# X-Client-Platform 请求头
# client_platform = "android"
# X-Client-Locale 请求头
# client_locale = "zh_CN"
#
# ── 以下为 2026-09 对齐真实客户端抓包结果补充的拟态字段 ──────────────────
#
# 登录 payload 的 os 字段（与 client_platform 对应：web / android）
# client_os = "android"
# X-Client-Bundle-Id 请求头（真实客户端固定 com.deepseek.chat）
# client_bundle_id = "com.deepseek.chat"
# X-Device-Id 请求头 / check_device payload 使用的设备 UUID。
# 真实客户端「每个安装一个持久 UUID」；留空时服务首次启动会生成一个随机 UUID
# 并写回本配置（此后重启/热重载都保持同一身份）。填任意 UUID 字符串可覆盖。
# client_device_id = ""
# X-Device-Model 请求头（真实 Web 客户端发空串）
# client_device_model = ""
# X-Client-Timezone-Offset 请求头（UTC+8 = 28800）
# client_timezone_offset = "28800"

# 是否在 completion 请求上回传 x-hif-leim 风控令牌（默认 true）
#
# 真实 Web/App 客户端启动后会轮询 hif-leim.deepseek.com 取一个短期令牌
# （有效期由响应头 x-hif-ttl 给出，默认 600s），并在 SSE（completion）请求上
# 以 x-hif-leim 头回传。缺少该头时上游可直接判定请求并非来自官方客户端 ——
# 这是第三方反代最容易漏掉的风控信号。关闭仅用于对照实验。
# hif_enabled = true

# API 基础地址（默认）
# api_base = "https://chat.deepseek.com/api/v0"

# WASM 文件完整 URL（PoW 计算所需，版本号会变动，建议手动更新）
# wasm_url = "https://fe-static.deepseek.com/chat/static/sha3_wasm_bg.7b9ca65ddd.wasm"

# 代理配置（可选，绕过 CloudFront WAF 地区限制）
# 使用非美国地区的代理出口节点可避免 WAF Challenge
# [proxy]
# url = "http://127.0.0.1:7890"
# url = "socks5://127.0.0.1:7891"

# 支持的模型类型列表。
#
# 当前上游状态（见 /api/v0/client/settings 的 model_configs）：
#   default  快速模式  enabled=true,  switchable=true
#   expert   专家模式  enabled=false, switchable=false   ← 网页端已下线
#   vision   识图模式  enabled=false, switchable=false   ← 网页端已下线
#
# 因此默认只暴露 default（即 deepseek-default）。
# expert / vision 的 API 仍可调用，但上游已标记为 disabled，
# 建议不要启用，否则用户请求容易失败或行为不稳定。
# 若确需启用：model_types = ["default", "expert", "vision"]
#
# model_types = ["default"]
# max_input_tokens = [1048576]
# max_output_tokens = [384000]
# 上游对全部 model_type 均返回 input_character_limit = 2621440
# input_character_limits = [2621440]

# 模型别名（可选，按 index 对齐 model_types，默认无别名）
# 除 deepseek-<type> 外，裸 model_type 名（如 "default"）也可直接作为 model 使用
# model_aliases = []

# 工具调用标签配置
# 内置模糊匹配：全角 `｜`(U+FF5C) 与 `▁`(U+2581) 分别等价于 ASCII `|` 和 `_`，
# 自动覆盖大多数字符级幻觉变体。
# extra 用于格式完全不同的回退标签（如 <tool_call>）：
# tool_call.extra_starts = ["<|tool_call_begin|>", "<tool_calls>", "<tool_call>"]
# tool_call.extra_ends = ["<|tool_call_end|>", "</tool_calls>", "</tool_call>"]

# 每账号每小时请求上限（0 = 不限制，默认 60）
#
# 为什么需要它：实测同一账号累计约 215 次请求后会被上游禁言（biz_code=5），
# 且禁言是**延迟判定**的 —— 跑到一半没事，跑完才封。该配额在账号维度做
# 一小时的滑动窗口限流：用尽的账号在本窗口内不再被分配，由其他账号承接；
# 全部账号都超限时请求返回 429，而不是继续硬打上游。
#
# 需要更高吞吐请**增加账号数量**，而不是抬高这个值。
# hourly_request_quota = 60

# ── 搜索模式默认值 ─────────────────────────────────────────────────────
#
# 请求未携带 web_search_options 时，是否默认开启 DeepSeek 的搜索模式。
# 搜索模式会让上游注入更强的系统提示词（联网检索）。
#
#   true （默认）—— 保持历史行为：始终开启
#   false        —— 严格遵循 OpenAI 语义：未传即关闭，不注入搜索提示词
#
# 显式传入 web_search_options 时，无论该值为何都会开启搜索。
# default_search_enabled = true

# ── Responses API 上下文缓存（POST /v1/responses）──────────────────────
#
# OpenAI Responses API 用 `previous_response_id` 维持多轮上下文。
# 本代理是无状态网关，无法像 OpenAI 那样长期保存响应，因此使用
# **进程内、有界、带 TTL** 的缓存来支撑该参数：
#   - 仅在请求未显式设置 store = false 时写入
#   - 超过容量或 TTL 后条目被淘汰，此后引用该 ID 会返回 400
#   - 客户端若需要跨重启的稳定上下文，应每轮都重放完整 input
#
# 每条缓存只保存一轮的 output 数组（通常几 KB）。
# responses_store_capacity = 256    # 最多保存多少轮（默认 256）
# responses_store_ttl_secs = 3600   # 条目存活秒数（默认 3600）

# Admin 配置（由管理面板自动管理，部署时无需手动填写）
# [admin]
# password_hash = ""
# jwt_secret = ""
# jwt_issued_at = 0
